spring:
  application:
    name: tournament-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tournament_db}
    username: ${DB_USERNAME:tournament_app}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      continue-on-error: false
server:
  port: ${SERVER_PORT:8080}
application:
  name: tournament-service
  description: REST API спортивного турнира
  version: 1.0.0
  tournament:
    default-status: PLANNED
    default-application-status: PENDING
  validation:
    allow-empty-team-name: false
    allow-empty-tournament-name: false

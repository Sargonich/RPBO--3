services:
  db:
    image: postgres:16-alpine
    container_name: tournament-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tournament_db}
      POSTGRES_USER: ${POSTGRES_USER:-tournament_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_admin}
      APP_DB_USER: ${APP_DB_USER:-tournament_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:-change_me_app}
    ports:
      - "5432:5432"
    volumes:
      - tournament_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tournament_admin} -d ${POSTGRES_DB:-tournament_db}"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    container_name: tournament-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tournament_db}
      DB_USERNAME: ${APP_DB_USER:-tournament_app}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_app}
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  tournament_db_data:
